# macOS override — loaded on top of docker-compose.yml on Apple Silicon.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.override.macos.yml up --build
#
# What this does: sets linux/arm64 platform for all services so Docker Desktop
# on Apple Silicon runs native ARM images instead of Rosetta emulation.
# Ollama runs containerised (same as WSL2) — no host daemon needed.

services:
  frontend:
    platform: linux/arm64
  api-gateway:
    platform: linux/arm64
  voice-service:
    platform: linux/arm64
  agentic-service:
    platform: linux/arm64
  rag-service:
    platform: linux/arm64
  ingestion-service:
    platform: linux/arm64
  chromadb:
    platform: linux/arm64
  ollama:
    platform: linux/arm64
    deploy:
      resources:
        reservations:
          devices: []   # macOS: no CUDA — clear the GPU reservation from base compose
  ollama-pull:
    platform: linux/arm64
  aspire:
    platform: linux/arm64
  portainer:
    platform: linux/arm64
