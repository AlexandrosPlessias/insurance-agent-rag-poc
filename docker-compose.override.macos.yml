# macOS override — loaded on top of docker-compose.yml on Apple Silicon.
#
# Sets linux/arm64 platform for all project services so Docker Desktop on Apple Silicon
# runs native ARM images instead of Rosetta emulation.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.override.macos.yml up --build
#
# Infra (Ollama Metal GPU proxy) is handled separately by ./start-infra.sh via
# docker-compose.infra.mac.yml — do not add infra services here.

services:
  frontend:
    platform: linux/arm64
  api-gateway:
    platform: linux/arm64
  voice-service:
    platform: linux/arm64
  agentic-service:
    platform: linux/arm64
  rag-service:
    platform: linux/arm64
  ingestion-service:
    platform: linux/arm64
  chromadb:
    platform: linux/arm64
  aspire:
    platform: linux/arm64
  postgres:
    platform: linux/arm64
