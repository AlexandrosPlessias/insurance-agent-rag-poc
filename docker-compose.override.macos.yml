# macOS override — loaded on top of docker-compose.yml on Apple Silicon.
#
# Usage:
#   ./start-infra.sh            # start shared Ollama + Portainer (idempotent)
#   docker compose -f docker-compose.yml -f docker-compose.override.macos.yml up --build
#
# What this does: sets linux/arm64 platform for all project services so Docker Desktop
# on Apple Silicon runs native ARM images instead of Rosetta emulation.
#
# Ollama and Portainer live in docker-compose.infra.yml (shared across projects) and are
# started separately via ./start-infra.sh — they do not appear here.

services:
  frontend:
    platform: linux/arm64
  api-gateway:
    platform: linux/arm64
  voice-service:
    platform: linux/arm64
  agentic-service:
    platform: linux/arm64
  rag-service:
    platform: linux/arm64
  ingestion-service:
    platform: linux/arm64
  chromadb:
    platform: linux/arm64
  aspire:
    platform: linux/arm64
  postgres:
    platform: linux/arm64
