[project]
name = "agentic_backend"
version = "0.1.0"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["agentic_backend*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.flake8]
max-line-length = 100
extend-ignore = [
    "E203",   # whitespace before ':' (Black-compatible)
    "W503",   # line break before binary operator (Black-compatible)
]
exclude = [
    ".venv",
    "__pycache__",
    "*.egg-info",
]
