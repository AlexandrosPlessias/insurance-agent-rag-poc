[project]
name = "agentic_backend"
version = "0.1.0"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["agentic_backend*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires a running Docker stack (ChromaDB + Ollama) — run with --skip-ingest inside the container",
]
filterwarnings = [
    # LoggingHandler in opentelemetry-sdk is deprecated but no public replacement
    # exists in the installed version — suppressed until the SDK provides a migration path.
    "ignore:.*LoggingHandler.*deprecated.*:DeprecationWarning:opentelemetry",
]

[tool.isort]
profile = "black"
line_length = 100

[tool.flake8]
max-line-length = 100
extend-ignore = [
    "E203",   # whitespace before ':' (Black-compatible)
    "W503",   # line break before binary operator (Black-compatible)
]
exclude = [
    ".venv",
    "__pycache__",
    "*.egg-info",
]
