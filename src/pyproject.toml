[project]
name = "agentic_backend"
version = "0.1.0"
requires-python = ">=3.11"

[project.optional-dependencies]
# Minimal install for running test_imports.py natively (no Docker needed):
#   pip install -e "src/[test]"
#   cd src && pytest tests/unit/test_imports.py -v
test = [
    "fastapi>=0.115.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp>=1.27.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-ollama>=0.2.0",
    "langchain-chroma>=0.1.4",
    "langchain-text-splitters>=0.3.0",
    "langgraph>=0.2.0",
    "ollama>=0.4.0",
    "chromadb>=0.5.0",
    "pandas>=2.2.0",
    "matplotlib>=3.9.0",
    "python-docx>=1.1.0",
    "reportlab>=4.2.0",
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["agentic_backend*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires a running Docker stack (ChromaDB + Ollama) — run with --skip-ingest inside the container",
]
filterwarnings = [
    # LoggingHandler in opentelemetry-sdk is deprecated but no public replacement
    # exists in the installed version — suppressed until the SDK provides a migration path.
    "ignore:.*LoggingHandler.*deprecated.*:DeprecationWarning:opentelemetry",
]

[tool.isort]
profile = "black"
line_length = 100

[tool.flake8]
max-line-length = 100
extend-ignore = [
    "E203",   # whitespace before ':' (Black-compatible)
    "W503",   # line break before binary operator (Black-compatible)
]
exclude = [
    ".venv",
    "__pycache__",
    "*.egg-info",
]
