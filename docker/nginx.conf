server {
    listen 80;

    # Serve the built React SPA — fallback to index.html for client-side routing
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # Proxy all /api/* requests to the api-gateway container
    # proxy_buffering off is critical: SSE /chat/stream chunks must flow
    # through immediately without nginx accumulating the full response first.
    location /api/ {
        proxy_pass http://api-gateway:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }
}
